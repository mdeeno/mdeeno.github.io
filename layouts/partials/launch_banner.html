<div class="launch-banner" id="launch-banner">
  <div class="launch-banner__inner">
    <span class="launch-banner__badge">NEW</span>
    <span class="launch-banner__text">
      <strong>M-DEENO 정식 오픈</strong> — 무료 리스크 진단 + 전자책 출간
    </span>
    <a href="https://mdeeno.com/member?utm_source=blog&utm_medium=banner&utm_campaign=launch"
       target="_blank" rel="noopener noreferrer"
       class="launch-banner__btn">무료 진단</a>
    <a href="https://mdeeno.com/ebook?utm_source=blog&utm_medium=banner&utm_campaign=launch_ebook"
       target="_blank" rel="noopener noreferrer"
       class="launch-banner__btn launch-banner__btn--gold">전자책</a>
    <button class="launch-banner__close" aria-label="닫기"
            onclick="(function(el){el.closest('.launch-banner').style.display='none';try{localStorage.setItem('launch_banner_dismissed','1')}catch(e){}})(this)">&times;</button>
  </div>
</div>
<style>
.launch-banner{background:#1b2a4e;color:#fff;padding:10px 16px;font-size:13px;position:relative;z-index:10;}
.launch-banner__inner{max-width:900px;margin:0 auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center;}
.launch-banner__badge{background:#dc2626;color:#fff;font-size:10px;font-weight:800;padding:2px 7px;border-radius:4px;letter-spacing:1px;}
.launch-banner__text{color:#c9d2e4;}
.launch-banner__text strong{color:#fff;}
.launch-banner__btn{background:#1e40af;color:#fff;padding:5px 12px;border-radius:6px;font-size:12px;font-weight:700;text-decoration:none;white-space:nowrap;}
.launch-banner__btn:hover{background:#1e3a8a;}
.launch-banner__btn--gold{background:#c9a961;color:#1b2a4e;}
.launch-banner__btn--gold:hover{background:#b89a52;}
.launch-banner__close{background:none;border:none;color:#6b7684;font-size:18px;cursor:pointer;padding:0 4px;line-height:1;}
@media(max-width:640px){.launch-banner__inner{font-size:12px;gap:6px;}}
</style>
<script>
(function(){try{if(localStorage.getItem('launch_banner_dismissed')==='1'){var b=document.getElementById('launch-banner');if(b)b.style.display='none';}}catch(e){}})();
</script>
