{{/* GoatCounter 페이지 뷰 카운터 */}}
<span class="post-views" id="gc-views" style="font-size:0.78rem;color:#888;margin-left:8px;">
  <span id="gc-count">…</span> views
</span>
<script>
  (function() {
    var el = document.getElementById('gc-count');
    if (!el) return;
    fetch('https://mdeeno.goatcounter.com/counter/' + encodeURIComponent(location.pathname) + '.json')
      .then(function(r) { return r.json(); })
      .then(function(d) { el.innerText = d.count; })
      .catch(function() { el.parentElement.style.display = 'none'; });
  })();
</script>
