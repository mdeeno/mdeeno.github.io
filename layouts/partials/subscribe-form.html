{{/* 블로그 이메일 구독 폼 — 포스트 하단에 삽입 */}}
<div id="mdeeno-subscribe" style="
  margin: 40px 0 24px;
  padding: 28px 24px;
  background: #f8fafc;
  border: 1.5px solid #e2e8f0;
  border-radius: 16px;
  text-align: center;
  word-break: keep-all;
">
  <p style="
    margin: 0 0 4px;
    font-size: 18px;
    font-weight: 800;
    color: #191f28;
    line-height: 1.4;
  ">재건축 리스크 인사이트, 매주 받아보세요</p>
  <p style="
    margin: 0 0 20px;
    font-size: 14px;
    color: #6b7684;
    line-height: 1.6;
  ">공사비 변동, 분양가 트렌드, 총회 전략 등 핵심만 엄선합니다</p>

  <form id="mdeeno-subscribe-form" style="
    display: flex;
    gap: 8px;
    max-width: 440px;
    margin: 0 auto;
    flex-wrap: wrap;
    justify-content: center;
  ">
    <input
      type="email"
      name="email"
      placeholder="이메일 주소 입력"
      required
      autocomplete="email"
      style="
        flex: 1 1 240px;
        min-width: 200px;
        padding: 14px 16px;
        font-size: 16px;
        border: 1.5px solid #d1d5db;
        border-radius: 12px;
        outline: none;
        background: #fff;
        color: #191f28;
        -webkit-appearance: none;
      "
    />
    <button
      type="submit"
      id="mdeeno-subscribe-btn"
      style="
        padding: 14px 24px;
        font-size: 15px;
        font-weight: 700;
        color: #fff;
        background: #1e40af;
        border: none;
        border-radius: 12px;
        cursor: pointer;
        min-height: 48px;
        white-space: nowrap;
        -webkit-tap-highlight-color: transparent;
      "
    >확인 메일 받기</button>
  </form>

  <p id="mdeeno-subscribe-msg" style="
    margin: 12px 0 0;
    font-size: 13px;
    line-height: 1.5;
    color: #6b7684;
    display: none;
  "></p>

  <p style="
    margin: 12px auto 0;
    max-width: 440px;
    font-size: 13px;
    line-height: 1.55;
    color: #6b7684;
  ">이메일 확인을 완료하면 뉴스레터 발송과 구독 관리에 사용합니다. 구독은 언제든 취소할 수 있습니다. <a href="https://mdeeno.com/privacy" target="_blank" rel="noopener noreferrer" style="color:#1e40af;text-decoration:underline;">개인정보처리방침</a></p>
</div>

<script>
(function() {
  var form = document.getElementById('mdeeno-subscribe-form');
  var btn = document.getElementById('mdeeno-subscribe-btn');
  var msg = document.getElementById('mdeeno-subscribe-msg');
  if (!form) return;

  form.addEventListener('submit', function(e) {
    e.preventDefault();
    var emailInput = form.querySelector('input[name="email"]');
    var email = emailInput.value.trim();
    if (!email) return;

    btn.disabled = true;
    btn.textContent = '처리 중...';
    btn.style.opacity = '0.7';
    msg.style.display = 'none';

    fetch('https://mdeeno.com/api/subscribe', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        email: email,
        source: 'blog'
      })
    })
    .then(function(res) { return res.json().then(function(data) { return { ok: res.ok, data: data }; }); })
    .then(function(result) {
      msg.style.display = 'block';
      if (result.ok || result.data.ok) {
        msg.style.color = '#16a34a';
        msg.textContent = result.data.message || '신청을 접수했습니다. 구독 가능한 주소라면 확인 이메일을 보내드립니다.';
        emailInput.value = '';
        // 요청 접수 이벤트. 실제 이메일 발송 성공은 서버 측 비식별 로그를 SSoT로 사용한다.
        if (window.gtag) {
          window.gtag('event', 'blog_subscribe_request_accepted', {
            event_category: 'engagement',
            event_label: 'blog_footer_form'
          });
        }
      } else {
        msg.style.color = '#dc2626';
        msg.textContent = result.data.error || '오류가 발생했습니다. 다시 시도해 주세요.';
      }
    })
    .catch(function() {
      msg.style.display = 'block';
      msg.style.color = '#dc2626';
      msg.textContent = '네트워크 오류가 발생했습니다. 잠시 후 다시 시도해 주세요.';
    })
    .finally(function() {
      btn.disabled = false;
      btn.textContent = '확인 메일 받기';
      btn.style.opacity = '1';
    });
  });
})();
</script>
