baseURL = 'https://tech.mdeeno.com/'
languageCode = 'ko-kr'
title = 'M-DEENO'
theme = 'PaperMod'

enableRobotsTXT = true
canonifyURLs = true

# Google Analytics 4 — GA4 측정 ID를 아래에 입력하세요 (예: G-XXXXXXXXXX)
[services.googleAnalytics]
  ID = "G-XXXXXXXXXX"

[params]
  description = "재건축 분담금, 비례율, 용적률, 이주비 — M-DEENO가 데이터로 분석하는 정비사업 리스크 가이드"
  author = "M-DEENO Corp."
  env = "production"

  defaultTheme = "dark"
  disableThemeToggle = true
  ShowShareButtons = true
  ShowReadingTime = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true

  naver_verify = "코드값"

  # 메인 화면 모드 (랜딩 페이지 브랜딩)
  [params.homeInfoParams]
    Title = "M-DEENO | 재건축·재개발 데이터 분석"
    Content = """
    재건축 분담금이 얼마나 나올지 아직 모르신다면,<br>
    지금 바로 **<a href="https://mdeeno.com/member" target="_blank" rel="noopener noreferrer">M-DEENO 무료 분석</a>** 을 시작하세요.<br><br>
    Prop-Logic™ 엔진이 공사비 상승·비례율 변동·분담금 리스크를 시뮬레이션합니다.
    """
  
  mainSections = ["posts"]

  [params.cover]
    hidden = false
    hiddenInList = false
    hiddenInSingle = false
    responsiveImages = true


  [params.verification]
    naver = "2f237c17ee6a92cf4e3591b76895cfd73bf59bca"

[outputs]
  home = ["HTML", "RSS", "JSON"]

# 상단 메뉴바 설정 (전문성 강화)
[[menu.main]]
  identifier = "archives"
  name = "🗂️ 전체 리포트"
  url = "/archives/"
  weight = 10

[[menu.main]]
  identifier = "categories"
  name = "📂 분석 분야"
  url = "/categories/"
  weight = 20

[[menu.main]]
  identifier = "calculators"
  name = "📊 부동산/금융 계산기"
  url = "/calculators/"
  weight = 25

[[menu.main]]
  identifier = "search"
  name = "🔍 데이터 검색"
  url = "/search/"
  weight = 40

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true