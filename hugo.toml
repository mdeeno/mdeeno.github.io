baseURL = 'https://tech.mdeeno.com/'
languageCode = 'ko-kr'
title = 'M-DEENO'
theme = 'PaperMod'

enableRobotsTXT = true
canonifyURLs = true

# Google Analytics 4 — GA4 측정 ID를 아래에 입력하세요 (예: G-XXXXXXXXXX)
[services.googleAnalytics]
  ID = "G-77C1K4JKYP"

[params]
  description = "재건축 분담금, 비례율, 용적률, 이주비 — M-DEENO가 데이터로 분석하는 정비사업 리스크 가이드"
  author = "M-DEENO Corp."
  env = "production"

  defaultTheme = "light"
  disableThemeToggle = false
  ShowShareButtons = true
  ShowReadingTime = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true

  naver_verify = "코드값"

  # homeInfoParams — 커스텀 index.html로 대체됨
  [params.homeInfoParams]
    Title = "M-DEENO | 재건축·재개발 데이터 분석"
    Content = "재건축 분담금·수익률을 데이터로 분석합니다."
  
  mainSections = ["posts"]

  [params.cover]
    hidden = false
    hiddenInList = false
    hiddenInSingle = false
    responsiveImages = true


  [params.verification]
    naver = "2f237c17ee6a92cf4e3591b76895cfd73bf59bca"

[outputs]
  home = ["HTML", "RSS", "JSON"]

# 상단 메뉴
[[menu.main]]
