baseURL = 'https://tech.mdeeno.com/'
languageCode = 'ko-kr'
title = 'M-DEENO(엠디노) | BLOG'
theme = 'PaperMod'
copyright = "© 2026 M-DEENO. All rights reserved."

enableRobotsTXT = true
canonifyURLs = false

[related]
  includeNewer = true
  threshold    = 60
  toLower      = true
  [[related.indices]]
    name   = "tags"
    weight = 80
  [[related.indices]]
    name   = "categories"
    weight = 20

# Google Analytics 4 — GA4 측정 ID를 아래에 입력하세요 (예: G-XXXXXXXXXX)
[services.googleAnalytics]
  ID = "G-M9K66C8K2Y"

[params]
