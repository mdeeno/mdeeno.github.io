baseURL = 'https://tech.mdeeno.com/'
languageCode = 'ko-kr'
defaultContentLanguage = 'ko'
title = 'M-DEENO(엠디노) | BLOG'
theme = 'PaperMod'
copyright = "© 2026 M-DEENO. All rights reserved."

enableRobotsTXT = true
canonifyURLs = false

[languages.ko]
  languageName = "한국어"
  weight = 1

[related]
  includeNewer = true
  threshold    = 60
  toLower      = true
  [[related.indices]]
    name   = "tags"
    weight = 80
  [[related.indices]]
    name   = "categories"
    weight = 20

# Google Analytics 4 — GA4 측정 ID를 아래에 입력하세요 (예: G-XXXXXXXXXX)
[services.googleAnalytics]
  ID = "G-M9K66C8K2Y"

[params]
  images = ["og-image.png"]
  description = "엠디노 — 재건축 분담금, 비례율, 용적률, 이주비를 데이터로 분석하는 정비사업 리스크 가이드"
  author = "M-DEENO Corp."
  env = "production"
  defaultTheme = "light"
  disableThemeToggle = true
  ShowShareButtons = true
  ShareButtons = ["kakao", "facebook", "x"]
  ShowReadingTime = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowToc = true
  TocOpen = true
  mainSections = ["posts"]

  # Kakao Share SDK (JavaScript 키 — 클라이언트용, 도메인 제한)
  kakao_js_key = "d411fd7e238ababcfa850f5791bfaba9"

  # AdSense — 활성화 (2026-05-16, 실업급여 수급 종료 결정)
  adsense_publisher_id = "ca-pub-4528164523701174"
  adsense_slot_id      = "7677212790"
  adsense_slot_id_inline = ""
  adsense_active_date  = "2026-05-16"

  # [2026-04-17] 블로그 포스트 직접 수정 (GitHub 웹 에디터 연동)
  # 각 포스트 메타에 "✏️ 수정" 링크 표시 → 클릭 시 GitHub 에디터 열림 → 수정·저장 → 자동 배포
  [params.editPost]
    URL = "https://github.com/mdeeno/mdeeno.github.io/edit/main/content"
    Text = "✏️ 이 글 수정하기"
    appendFilePath = true

  [params.assets]
    theme_color = "#f5f7fa"   # 라이트 배경 — 삼성 인터넷 다크모드 힌트 방지

  [params.analytics.google]
    SiteVerificationTag = "egpUo4dD8e73c7-Sgf7SNHoeFg6kOsPtJf6JoYGE6pw"

  # 네이버 웹마스터도구 인증 — 기존 코드가 [params.verification]에 mis-key돼 렌더 안 되던 것 교정.
  # PaperMod head는 params.analytics.naver.SiteVerificationTag 경로를 읽는다.
  [params.analytics.naver]
    SiteVerificationTag = "2f237c17ee6a92cf4e3591b76895cfd73bf59bca"

  [params.label]
    text = "BLOG"
    icon = "images/logo.png"
    iconHeight = 24

  [params.homeInfoParams]
    Title = "M-DEENO(엠디노) | 재건축·재개발 데이터 분석"
    Content = "엠디노 — 재건축 분담금·수익률을 데이터로 분석합니다."

  [[params.socialIcons]]
    name = "kakaotalk"
    url  = "https://pf.kakao.com/_xmHdlX"
  [[params.socialIcons]]
    name = "website"
    url  = "https://mdeeno.com"

  [params.cover]
    hidden = false
    hiddenInList = false
    hiddenInSingle = false
    responsiveImages = true

  [params.verification]
    naver = "2f237c17ee6a92cf4e3591b76895cfd73bf59bca"

# GEO(생성형 검색 최적화): AI 크롤러용 llms.txt 출력 — 사이트 콘텐츠 맵을 평문으로 제공
[outputFormats.LLMS]
  mediaType = "text/plain"
  baseName = "llms"
  isPlainText = true
  rel = "alternate"

[outputs]
  home = ["HTML", "RSS", "JSON", "LLMS"]
  section = ["HTML", "RSS"]
  taxonomy = ["HTML", "RSS"]
  term = ["HTML", "RSS"]

[sitemap]
  changefreq = "weekly"
  priority = 0.5
  filename = "sitemap.xml"

[minify]
  minifyOutput = true

